services:
  - type: web
    name: ci-memory
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ci_memory
      - key: CI_TEAM_ID
        value: hackathon
      - key: CI_REPOSITORY_ID
        value: iamabhishek841/ci-memory_mongodb
      - key: DEMO_WRITE_TOKEN
        generateValue: true
